<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Honey</title>
  <!--
    TO CHANGE WHERE THE QR CODE GOES: replace the link after "url=" on the next line.
    That is the only line you ever need to edit.
  -->
  <meta http-equiv="refresh" content="0; url=PASTE_FORM_LINK_HERE">
  <style>
    body { font-family: system-ui, sans-serif; background: #fdf6e3; color: #3b2f1e;
           display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    a { color: #b36b00; font-size: 1.25rem; }
  </style>
</head>
<body>
  <p>Taking you to the honey order form…<br><br>
     <a id="go" href="#">Tap here if nothing happens</a></p>
  <script>
    var url = document.querySelector('meta[http-equiv="refresh"]').content.split('url=')[1];
    document.getElementById('go').href = url;
    location.replace(url);
  </script>
</body>
</html>
